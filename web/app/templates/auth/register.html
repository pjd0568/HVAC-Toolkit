{% extends "marketing/base.html" %}
{% block title %}Create account — {{ brand_name }}{% endblock %}
{% block content %}
<section class="auth-panel">
  <div class="auth-brand" aria-hidden="true">
    <img
      class="auth-brand-mark"
      src="{{ brand_mark_url }}"
      width="48"
      height="48"
      alt=""
      decoding="async"
    >
  </div>
  <h1>Create account</h1>
  <p class="coming-section-lead">
    Sign up to open the toolkit. New accounts get a 14-day Pro trial.
  </p>
  <form method="post" action="{{ url_for('auth.register_post') }}" class="auth-form">
    <label>
      Email
      <input type="email" name="email" required autocomplete="username" autofocus>
    </label>
    <label>
      Password
      <input type="password" name="password" required minlength="8" autocomplete="new-password">
    </label>
    <label>
      Confirm password
      <input type="password" name="password2" required minlength="8" autocomplete="new-password">
    </label>
    <button type="submit" class="btn-accent">Create account</button>
  </form>
  <p class="auth-switch">
    Already have an account?
    <a href="{{ url_for('auth.login') }}">Log in</a>
  </p>
</section>
{% endblock %}
