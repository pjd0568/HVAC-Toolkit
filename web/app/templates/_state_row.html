{% macro state_cells(s) -%}
{# Numbers only — column headers carry the units so values line up. #}
<td class="num">{{ U.fmt('temperature', s.t_db) }}</td>
<td class="num">{{ '%.0f'|format(s.rh * 100) }}</td>
<td class="num">{{ U.fmt('humidity_ratio', s.w) }}</td>
<td class="num">{{ U.fmt('enthalpy', s.h) }}</td>
{%- endmacro %}
