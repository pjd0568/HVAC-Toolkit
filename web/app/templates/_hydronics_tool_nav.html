{# In-suite switcher. Pass tool=pipe|system|vessel|buffer #}
<nav class="suite-tool-nav" aria-label="Hydronics tools">
  {% if access.can('pipe.sizer') %}
  <a href="{{ url_for('v2.pipe') }}"
     class="{{ 'active' if tool == 'pipe' }}">
    <span class="suite-tool-nav-full">Pipe sizing</span>
    <span class="suite-tool-nav-short">Pipe</span>
  </a>
  {% endif %}
  {% if access.can('pipe.system') %}
  <a href="{{ url_for('v2.pipe_system') }}"
     class="{{ 'active' if tool == 'system' }}">
    <span class="suite-tool-nav-full">System ΔP</span>
    <span class="suite-tool-nav-short">System</span>
  </a>
  {% endif %}
  <a href="{{ url_for('v2.coming_soon_tool', slug='expansion-vessel') }}"
     class="{{ 'active' if tool == 'vessel' }}">
    <span class="suite-tool-nav-full">Expansion vessel</span>
    <span class="suite-tool-nav-short">Vessel</span>
    <span class="soon">Soon</span>
  </a>
  <a href="{{ url_for('v2.coming_soon_tool', slug='buffer-tank') }}"
     class="{{ 'active' if tool == 'buffer' }}">
    <span class="suite-tool-nav-full">Buffer tank</span>
    <span class="suite-tool-nav-short">Buffer</span>
    <span class="soon">Soon</span>
  </a>
  <a href="{{ url_for('v2.water_picker') }}" class="suite-tool-nav-all">All</a>
</nav>
