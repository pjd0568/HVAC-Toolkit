[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hvac-engine"
version = "0.1.0"
description = "Standalone HVAC calculation engine — psychrometrics, air treatment processes, duct, pipe, and refrigeration/DX. Implemented from public engineering standards (ASHRAE HOF, CIBSE)."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
refrigeration = ["CoolProp>=6.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
